# =============================================================================
# Experiment: 5-class MCLDNN-Attention with gated physical features (v2)
# =============================================================================
# Classes : BPSK, QPSK, 8PSK, QAM16, QAM64
# Model   : mcldnn_attention_phys
# Loss    : Standard categorical cross-entropy with label smoothing
#
# Purpose
# -------
# Test the professor's physical-feature hypothesis with a more robust design:
#
#   - QAM16 vs QAM64: expose amplitude distribution/variation.
#   - QPSK vs 8PSK  : expose rotation-aware differential phase.
#
# Physical inputs prepared by src/features/signal_features.py:
#
#   input4_amplitude_features:
#       [A(t), A(t)^2, delta_A(t), abs(delta_A(t))]
#
#   input5_dphase_sincos:
#       [cos(dphi(t)), sin(dphi(t))]
#
# Fusion design:
#   The raw IQ path goes through CNN + self-attention normally. The physical
#   branch is separate and is fused after attention pooling using:
#
#       final_context = main_context + gate * physics_context
#
# This run intentionally uses standard loss first, not the QAM shifted-cost
# loss, so the effect is representation-level rather than penalty-level.
#
# Note:
#   This v2 architecture is not compatible with old v1 physical-feature
#   checkpoints. Train from scratch; do not use --resume with the old
#   experiments/5class_attention_phys/checkpoints/best_model.weights.h5.
# =============================================================================

experiment:
  name: "5class_attention_phys"
  description: "MCLDNN attention with amplitude-variation and differential-phase features, late gated fusion, standard CE loss"
  track: "attention_phys"
  seed: 2016
  model: "mcldnn_attention_phys"

dataset:
  path: "data/RML2016.10a_5class.pkl"
  classes:
    - "BPSK"
    - "QPSK"
    - "8PSK"
    - "QAM16"
    - "QAM64"

# Keep the same split behavior as the current main attention experiment unless
# explicitly changed later.
shuffle_split: false

training:
  epochs: 10000
  batch_size: 400
  dropout_rate: 0.6
  early_stopping_patience: 10
  reduce_lr_patience: 5
  reduce_lr_factor: 0.5
  min_lr: 1.0e-7
  initial_lr: 0.0005

output:
  base_dir:        "experiments/5class_attention_phys"
  checkpoint_path: "experiments/5class_attention_phys/checkpoints/best_model.weights.h5"
  log_dir:         "experiments/5class_attention_phys/logs"
  figure_dir:      "experiments/5class_attention_phys/figures"
  result_dir:      "experiments/5class_attention_phys/results"

