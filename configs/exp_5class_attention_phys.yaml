# =============================================================================
# Experiment: 5-class MCLDNN-Attention with physical IQ features
# =============================================================================
# Classes : BPSK, QPSK, 8PSK, QAM16, QAM64
# Model   : mcldnn_attention_phys
# Loss    : Standard categorical cross-entropy with label smoothing
#
# Purpose
# -------
# Test the professor's physical-feature hypothesis cleanly:
#
#   • QPSK vs 8PSK confusion should improve from explicit phase structure.
#   • QAM16 vs QAM64 confusion should improve from explicit amplitude/radius
#     variation.
#
# This config intentionally does NOT use the QAM shifted cost matrix and does
# NOT use class weights. That keeps this run as a representation-level test,
# not a loss-penalty test.
#
# Physical inputs added by src/train.py for this model:
#   input4_amplitude    : A(t) normalized per sample by mean amplitude
#   input5_phase_sincos : [cos(phi), sin(phi)] = [I/A, Q/A]
#
# Existing attention model/configs are not modified.
# =============================================================================

experiment:
  name: "5class_attention_phys"
  description: "MCLDNN attention with amplitude and wrap-safe phase features before self-attention; standard CE loss"
  track: "attention_phys"
  seed: 2016
  model: "mcldnn_attention_phys"

dataset:
  path: "data/RML2016.10a_5class.pkl"
  classes:
    - "BPSK"
    - "QPSK"
    - "8PSK"
    - "QAM16"
    - "QAM64"

# Keep the same split behavior as the current main attention experiment unless
# explicitly changed later.
shuffle_split: false

training:
  epochs: 10000
  batch_size: 400
  dropout_rate: 0.6
  early_stopping_patience: 10
  reduce_lr_patience: 5
  reduce_lr_factor: 0.5
  min_lr: 1.0e-7
  initial_lr: 0.0005

output:
  base_dir:        "experiments/5class_attention_phys"
  checkpoint_path: "experiments/5class_attention_phys/checkpoints/best_model.weights.h5"
  log_dir:         "experiments/5class_attention_phys/logs"
  figure_dir:      "experiments/5class_attention_phys/figures"
  result_dir:      "experiments/5class_attention_phys/results"

