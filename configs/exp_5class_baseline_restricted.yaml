# =============================================================================
# Experiment: 5-class MCLDNN Baseline — SNR-restricted (-6 to +6 dB)
# =============================================================================
# Classes : BPSK, QPSK, 8PSK, QAM16, QAM64
# Dataset : RML2016.10a (filtered to 5 classes, SNR -6 to +6 dB only)
# Model   : MCLDNN — identical architecture to AMR-Benchmark original
# Purpose : Fair comparison baseline against the attention model.
#           Both this run and exp_5class_attention.yaml train on the SAME
#           7 SNR levels (-6,-4,-2,0,2,4,6) with the SAME global shuffle
#           split (seed=2016, 60/20/20), so accuracy differences are
#           attributable to architecture (LSTM vs self-attention) only.
# =============================================================================

experiment:
  name: "5class_baseline_restricted"
  description: "MCLDNN baseline trained on SNR -6 to +6 dB only — fair comparison with attention model"
  track: "5class"
  seed: 2016

dataset:
  # On Kaggle: set this to your Kaggle dataset input path, e.g.:
  #   /kaggle/input/rml2016-5class/RML2016.10a_5class.pkl
  # Locally: set to your absolute path
  path: "data/RML2016.10a_5class.pkl"
  classes:
    - "BPSK"
    - "QPSK"
    - "8PSK"
    - "QAM16"
    - "QAM64"

# SNR filtering: only train/evaluate on -6 dB to +6 dB
# Must match exp_5class_attention.yaml exactly for a fair comparison
snr_range:
  - -6
  - 6

# Global shuffle split required by professor — must match attention config
shuffle_split: true

training:
  epochs: 10000
  batch_size: 400
  early_stopping_patience: 100
  reduce_lr_patience: 15
  reduce_lr_factor: 0.5
  min_lr: 1.0e-7

output:
  base_dir:        "experiments/5class_baseline_restricted"
  checkpoint_path: "experiments/5class_baseline_restricted/checkpoints/best_model.weights.h5"
  log_dir:         "experiments/5class_baseline_restricted/logs"
  figure_dir:      "experiments/5class_baseline_restricted/figures"
  result_dir:      "experiments/5class_baseline_restricted/results"
