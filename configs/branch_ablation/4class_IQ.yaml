# Branch Ablation: 4-class, 2D-spatial (IQ) branch only
# dropout_rate: 0.3  — see 4class_Q.yaml for rationale.
#
# Architecture note:
#   The 'IQ' branch is a 2D-only CNN baseline: Conv2D(50,(2,8),same) →
#   Conv2D(100,(2,5),valid) on raw IQ input → LSTM head.
#   It tests whether the 2D spatial (amplitude+phase) representation alone
#   is sufficient for 4-class discrimination, without the 1D temporal branches.
#   This differs from the full model's IQ path (which receives 100-channel
#   concatenated I+Q 1D CNN features) and should be labelled '2D-only (IQ)'
#   in plots and tables.
# See exp_4class_ablation.yaml for split_file / l2_dense strategy.
experiment:
  name: "branch_4class_IQ"
  description: "MCLDNN 2D-spatial (IQ) branch only — 4-class ablation"
  track: "branch_ablation"
  seed: 2016
  branch: "IQ"

dataset:
  path: "data/RML2016.10a_4class.pkl"
  classes:
    - "QPSK"
    - "8PSK"
    - "QAM16"
    - "QAM64"

split_file: "data/split_4class_seed2016.npz"
transfer_from: "experiments/branch_5class/IQ_only/checkpoints/best_model.weights.h5"
transfer_source_classes: 5

training:
  epochs: 10000
  batch_size: 400
  initial_lr: 1.0e-4
  early_stopping_patience: 100
  reduce_lr_patience: 15
  reduce_lr_factor: 0.5
  min_lr: 1.0e-7
  dropout_rate: 0.3
  snr_weighted: true     # SNR-proportional sample weighting (root-cause fix)
  l2_lstm: 0.0          # Remove LSTM recurrent regularization (reduces vanishing gradients)
  l2_dense: 1.0e-4      # Reduced from 1e-3 for 4-class gradient balance

output:
  base_dir:        "experiments/branch_4class/IQ_only"
  checkpoint_path: "experiments/branch_4class/IQ_only/checkpoints/best_model.weights.h5"
  log_dir:         "experiments/branch_4class/IQ_only/logs"
  figure_dir:      "experiments/branch_4class/IQ_only/figures"
  result_dir:      "experiments/branch_4class/IQ_only/results"
