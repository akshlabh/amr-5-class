# =============================================================================
# Experiment: 5-class MCLDNN-LSTM64 — 5-Fold Cross-Validation
# =============================================================================
# Classes : BPSK, QPSK, 8PSK, QAM16, QAM64
# Dataset : RML2016.10a (filtered to 5 classes, all 20 SNRs)
# Model   : MCLDNN variant with 2×LSTM-64 instead of 2×LSTM-128
#
# Splitting:
#   Per (mod, SNR) block of 1000 samples:
#     200 -> final held-out test
#     800 -> 5 folds of 160 each for train/validation rotation
#
# Run:
#   python src/train_kfold.py --config configs/exp_5class_lstm64_kfold.yaml
# =============================================================================

experiment:
  name:  "5class_lstm64_kfold"
  model: "lstm64"
  seed:  2016

dataset:
  path: "data/RML2016.10a_5class.pkl"
  classes:
    - "BPSK"
    - "QPSK"
    - "8PSK"
    - "QAM16"
    - "QAM64"

kfold:
  n_folds: 5
  seed:    2016

training:
  epochs:                  10000
  batch_size:              400
  early_stopping_patience: 20
  reduce_lr_patience:      8
  reduce_lr_factor:        0.5
  min_lr:                  1.0e-7
  dropout_rate:            0.5
  l2_dense:                1.0e-3
  l2_lstm:                 1.0e-4
  initial_lr:              0.001

output:
  base_dir: "experiments/5class_lstm64_kfold"
