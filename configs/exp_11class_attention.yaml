# =============================================================================
# Experiment: 11-class MCLDNN-Attention
# =============================================================================
# Classes : All 11 RadioML2016.10a modulation classes
# Model   : Normal MCLDNN attention, no LSTM
# Purpose : Train the normal attention baseline for full 11-class comparison.
# =============================================================================

experiment:
  name: "11class_attention"
  description: "MCLDNN normal self-attention on all 11 RadioML2016.10a classes"
  track: "attention_11class"
  seed: 2016
  model: "mcldnn_attention"

dataset:
  path: "data/RML2016.10a_dict.pkl"
  classes:
    - "8PSK"
    - "AM-DSB"
    - "AM-SSB"
    - "BPSK"
    - "CPFSK"
    - "GFSK"
    - "PAM4"
    - "QAM16"
    - "QAM64"
    - "QPSK"
    - "WBFM"

# Keep the original per-(mod,SNR) 60/20/20 split.
shuffle_split: false

training:
  epochs: 10000
  batch_size: 400
  dropout_rate: 0.6
  early_stopping_patience: 12
  reduce_lr_patience: 5
  reduce_lr_factor: 0.5
  min_lr: 1.0e-7
  initial_lr: 0.0005

output:
  base_dir:        "experiments/11class_attention"
  checkpoint_path: "experiments/11class_attention/checkpoints/best_model.weights.h5"
  log_dir:         "experiments/11class_attention/logs"
  figure_dir:      "experiments/11class_attention/figures"
  result_dir:      "experiments/11class_attention/results"
