# =============================================================================
# Experiment: 5-class MCLDNN-Differential-Attention
# =============================================================================
# Classes : BPSK, QPSK, 8PSK, QAM16, QAM64
# Dataset : RML2016.10a filtered to the same 5 classes as the normal attention run
# Model   : mcldnn_diffattention
#
# Purpose
# -------
# Tuned after the first diff-attention result showed QAM64 collapse into QAM16.
# This version uses class weighting to force the model to learn the hard QAM
# boundary instead of solving four classes and ignoring QAM64.
#
# Main changes:
#   - model uses gated differential cancellation, initialized close to normal attention
#   - class-weighted cross-entropy is used during model.fit()
#   - dropout is reduced to help fit high-SNR QAM64 structure
#   - patience is increased so the hard QAM boundary has time to learn
# =============================================================================

experiment:
  name: "5class_diffattention"
  description: "MCLDNN with gated differential self-attention and QAM-focused class weights"
  track: "attention"
  seed: 2016
  model: "mcldnn_diffattention"

dataset:
  path: "data/RML2016.10a_5class.pkl"
  classes:
    - "BPSK"
    - "QPSK"
    - "8PSK"
    - "QAM16"
    - "QAM64"

# Keep same split behavior as the normal attention config for fair comparison.
shuffle_split: false

training:
  epochs: 10000
  batch_size: 400
  dropout_rate: 0.5
  early_stopping_patience: 20
  reduce_lr_patience: 8
  reduce_lr_factor: 0.5
  min_lr: 1.0e-7
  initial_lr: 0.0005
  class_weights:
    "BPSK":  1.0
    "QPSK":  1.0
    "8PSK":  1.0
    "QAM16": 2.0
    "QAM64": 2.0

output:
  base_dir:        "experiments/5class_diffattention"
  checkpoint_path: "experiments/5class_diffattention/checkpoints/best_model.weights.h5"
  log_dir:         "experiments/5class_diffattention/logs"
  figure_dir:      "experiments/5class_diffattention/figures"
  result_dir:      "experiments/5class_diffattention/results"
