# =============================================================================
# Experiment: 5-class MCLDNN-Differential-Attention
# =============================================================================
# Classes : BPSK, QPSK, 8PSK, QAM16, QAM64
# Dataset : RML2016.10a filtered to the same 5 classes as the normal attention run
# Model   : mcldnn_diffattention
#
# Purpose
# -------
# This is an apples-to-apples comparison against configs/exp_5class_attention.yaml.
# The convolutional front-end, classifier head, split policy, class weights,
# dropout, learning rate, and callbacks are kept the same.  The only model-level
# change is replacing ordinary softmax multi-head self-attention with
# differential self-attention.
# =============================================================================

experiment:
  name: "5class_diffattention"
  description: "MCLDNN with differential self-attention replacing normal self-attention"
  track: "attention"
  seed: 2016
  model: "mcldnn_diffattention"

dataset:
  path: "data/RML2016.10a_5class.pkl"
  classes:
    - "BPSK"
    - "QPSK"
    - "8PSK"
    - "QAM16"
    - "QAM64"

# Keep same split behavior as the normal attention config for fair comparison.
shuffle_split: false

training:
  epochs: 10000
  batch_size: 400
  dropout_rate: 0.6
  early_stopping_patience: 10
  reduce_lr_patience: 5
  reduce_lr_factor: 0.5
  min_lr: 1.0e-7
  initial_lr: 0.0005
  class_weights:
    "BPSK":  1.0
    "QPSK":  1.0
    "8PSK":  1.0
    "QAM16": 2.0
    "QAM64": 2.0

output:
  base_dir:        "experiments/5class_diffattention"
  checkpoint_path: "experiments/5class_diffattention/checkpoints/best_model.weights.h5"
  log_dir:         "experiments/5class_diffattention/logs"
  figure_dir:      "experiments/5class_diffattention/figures"
  result_dir:      "experiments/5class_diffattention/results"
