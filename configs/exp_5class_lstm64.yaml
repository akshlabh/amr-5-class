# =============================================================================
# Experiment: 5-class MCLDNN — LSTM hidden size 64 (reduced from 128)
# =============================================================================
# Classes  : BPSK, QPSK, 8PSK, QAM16, QAM64
# Dataset  : RML2016.10a (all 20 SNRs)
# Model    : MCLDNN with 2×LSTM-64  (~222K params vs baseline ~404K)
# Split    : Global shuffle 60/20/20 (seed=2016) — same as baseline & attention
#
# Parameter comparison:
#   Baseline  (2×LSTM-128) : ~404K
#   This      (2×LSTM-64)  : ~222K   ← closest to attention (~205K)
#   Attention              : ~205K
#
# Run:
#   python src/train_variants.py --config configs/exp_5class_lstm64.yaml
# =============================================================================

experiment:
  name:   "5class_lstm64"
  model:  "lstm64"         # selects MCLDNN_LSTM64 from mcldnn_lstm64.py
  seed:   2016

dataset:
  path: "data/RML2016.10a_5class.pkl"
  classes:
    - "BPSK"
    - "QPSK"
    - "8PSK"
    - "QAM16"
    - "QAM64"
  shuffle_split: true          # global 60/20/20 — same split as baseline & attention

shuffle_split: true            # train.py reads this at top-level

training:
  epochs:                  10000
  batch_size:              400
  early_stopping_patience: 20
  reduce_lr_patience:      8
  reduce_lr_factor:        0.5
  min_lr:                  1.0e-7
  dropout_rate:            0.5   # paper default
  l2_dense:                1.0e-3
  l2_lstm:                 1.0e-4
  initial_lr:              0.001

output:
  base_dir:        "experiments/5class_lstm64"
  checkpoint_path: "experiments/5class_lstm64/checkpoints/best_model.weights.h5"
  log_dir:         "experiments/5class_lstm64/logs"
  figure_dir:      "experiments/5class_lstm64/figures"
  result_dir:      "experiments/5class_lstm64/results"
